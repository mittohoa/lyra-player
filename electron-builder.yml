appId: com.mittohoa.lyra_player

# Nguon cap nhat: chinh trang phat hanh tren GitHub. Khong can may chu rieng,
# va `.blockmap` cho phep tai CHENH LECH - ban 104 MB nhung lan cap nhat sau
# thuong chi tai vai MB.
publish:
  provider: github
  owner: mittohoa
  repo: lyra-player
# TEN HIEN RA la AURA - dat o day chu KHONG dat trong package.json.
#
# Electron lay `app.getPath('userData')` tu `productName` cua package.json.
# Doi cho do thanh AURA la thu muc du lieu nhay tu %APPDATA%/Lyra sang
# %APPDATA%/AURA, va moi thu nguoi dung da co - cai dat, thu vien, danh sach
# phat, loi tu nhap, do lech gio, bo nho dem loi, mo hinh dich hang tram MB -
# nam lai o thu muc cu ma app khong con nhin thay.
#
# Da thu cach khac: goi `app.setPath` luc khoi dong. Cach do vua thua vua hong
# - no de len ca `--user-data-dir` nguoi dung tu chi, va bo kiem bat duoc ngay.
# De productName cua package.json nguyen la "Lyra" thi khong can dong ma nao.
productName: AURA
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json

  # Bộ chạy ONNX (dùng cho dịch lời) mang theo bản nhị phân của MỌI hệ điều
  # hành và MỌI kiến trúc — hơn 200 MB, mà bộ cài Windows x64 chỉ dùng đúng hai
  # file trong số đó. Không lọc thì người dùng tải về một đống thứ không bao giờ
  # chạy được trên máy họ.
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'

  # DirectML là bộ tăng tốc bằng GPU. Lyra dịch trên CPU, nên ba file này (38 MB)
  # chỉ nằm đó chiếm chỗ.
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxil.dll'

  # Bản chạy trong trình duyệt (WASM) — 130 MB, và tiến trình chính không dùng
  - '!node_modules/onnxruntime-web/**'

# Bản nhị phân gốc không nạp được từ trong file nén asar, phải để ngoài
asarUnpack:
  - node_modules/onnxruntime-node/**
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/smtc-watch.ps1
    to: smtc-watch.ps1
  - from: resources/thumbar
    to: thumbar
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Dat ten ngay o day thay vi doi tay luc tai len. Trang gioi thieu tro vao
  # dung hai ten nay; doi tay thi som muon cung co lan quen.
  artifactName: AURA-${version}-windows-portable.${ext}
nsis:
  artifactName: AURA-${version}-windows-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AURA
