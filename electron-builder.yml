appId: com.mittohoa.lyra_player
productName: Lyra
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/smtc-watch.ps1
    to: smtc-watch.ps1
  - from: resources/thumbar
    to: thumbar
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Lyra
